<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Thomas AI multi-agent lab flow</title>
  <desc id="desc">Planner dispatches parallel workers, a reviewer evaluates them, and a reporter produces a candidate result.</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#10201c} .box{fill:#f5f7ed;stroke:#91b7aa;stroke-width:2} .worker{fill:#fff8e8;stroke:#d4ae73;stroke-width:2} .arrow{stroke:#4d756b;stroke-width:3;fill:none;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4d756b"/></marker></defs>
  <rect class="box" x="20" y="120" width="190" height="80" rx="16"/><text x="115" y="153" text-anchor="middle" font-size="24" font-weight="700">Planner</text><text x="115" y="180" text-anchor="middle" font-size="15">hypotheses + criteria</text>
  <path class="arrow" d="M210 160 H290"/>
  <rect class="worker" x="300" y="30" width="190" height="62" rx="14"/><text x="395" y="68" text-anchor="middle" font-size="20">Worker A</text>
  <rect class="worker" x="300" y="134" width="190" height="62" rx="14"/><text x="395" y="172" text-anchor="middle" font-size="20">Worker B</text>
  <rect class="worker" x="300" y="238" width="190" height="62" rx="14"/><text x="395" y="276" text-anchor="middle" font-size="20">Worker C</text>
  <path class="arrow" d="M290 160 C270 160 270 61 300 61"/><path class="arrow" d="M290 160 H300"/><path class="arrow" d="M290 160 C270 160 270 269 300 269"/>
  <path class="arrow" d="M490 61 H610"/><path class="arrow" d="M490 165 H610"/><path class="arrow" d="M490 269 H610"/>
  <rect class="box" x="620" y="120" width="190" height="80" rx="16"/><text x="715" y="153" text-anchor="middle" font-size="24" font-weight="700">Reviewer</text><text x="715" y="180" text-anchor="middle" font-size="15">evidence + risks</text>
  <path class="arrow" d="M810 160 H890"/>
  <rect class="box" x="900" y="120" width="190" height="80" rx="16"/><text x="995" y="153" text-anchor="middle" font-size="24" font-weight="700">Reporter</text><text x="995" y="180" text-anchor="middle" font-size="15">report + artifacts</text>
</svg>
